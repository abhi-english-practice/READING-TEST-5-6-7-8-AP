</style></head><body><header><div class="brand">POP <b>DOSSIER</b></div><div class="headtools"><span class="saved" id="saved">Reading practice</span><button id="vi" aria-pressed="false">Tiếng Việt: off</button></div></header><main><nav id="tests" aria-label="Choose a test"></nav><nav id="sections" aria-label="Choose an activity"></nav><div class="titleline"><div><span class="kicker" id="tag"></span><h1 id="title"></h1></div><span class="badge" id="progress"></span></div><p id="instruction"></p><div id="content" class="layout"></div><div class="actions"><button class="primary" id="check">Check answers</button><button id="reset">Reset task</button><button id="download">Download answers</button><span id="message" role="status"></span></div><details class="glossary"><summary id="glossaryTitle">Collocations &amp; useful phrases</summary><div id="glossaryRows"></div></details><p class="audio-status" id="audioStatus" role="status"></p><div class="foot" id="source"></div></main><dialog id="confirm"><p>Clear your answers for this task?</p><button id="cancel">Cancel</button> <button id="erase">Clear answers</button></dialog><script>const DATA=[{"title":"Test 5","pages":"96–101","parts":[{"type":"gap","title":"A housewarming party","text":"Dear aunt and uncle,\nI hope you are both well. I’m writing to invite you to my {0} party next Saturday evening.\n{1} you will see, it’s a tiny little house but I love it! It’s very {2}. The rooms are all small but they are well designed and you will easily find your {3} around.\n\nI hope you can come. Please don’t bring anything, we have {4}.\n\nLooking forward to see you on Saturday.\nBye for now,\nSusan","options":[["housewarming","houseopening","housewelcoming"],["Can","As","If"],["large","interesting","cosy"],["things","like","way"],["much","plenty","more"]],"answer":[["housewarming"],["As"],["cosy"],["way"],["plenty"]],"vi":"Cô chú thân mến,\nCháu hy vọng cô chú đều khỏe. Cháu viết thư để mời cô chú đến dự tiệc mừng nhà mới vào tối thứ Bảy tới. Như cô chú sẽ thấy, căn nhà khá nhỏ nhưng cháu rất thích. Nhà rất ấm cúng; các phòng tuy nhỏ nhưng được thiết kế hợp lý nên cô chú sẽ dễ dàng tìm đường.\nCháu hy vọng cô chú có thể đến. Xin đừng mang gì theo vì nhà cháu có rất nhiều đồ rồi.\nMong gặp cô chú vào thứ Bảy.","glossary":[["housewarming party","ˈhaʊsˌwɔːmɪŋ ˌpɑːti","A celebration in a new home.","tiệc mừng nhà mới"]]},{"type":"sequence","title":"A Covid-safe office","start":"Welcome to our Covid-19 free office.","lines":["Put on your gloves and mask, and don’t take them out during office hours.","By doing these two simple things, you will not cross paths with your colleagues, and we will all be protected.","To leave the floor, use the elevator to go up, and the stairs to go down when you leave.","Before going in, please wash your hands with this hand sanitiser.","If you need to leave your desk, please follow the one-way system inside the office."],"answer":[3,0,4,2,1],"vi":["Chào mừng đến văn phòng an toàn với Covid-19.","Hãy đeo găng tay và khẩu trang, không tháo trong giờ làm việc.","Làm hai việc này giúp mọi người không chạm mặt nhau và đều được bảo vệ.","Khi rời tầng, hãy dùng thang máy để đi lên và cầu thang bộ để đi xuống.","Trước khi vào, hãy rửa tay bằng dung dịch sát khuẩn.","Nếu cần rời bàn, hãy đi theo hệ thống một chiều trong văn phòng."],"glossary":[["wash your hands","wɒʃ jɔː hændz","Clean your hands with soap or sanitiser.","rửa tay"]]},{"type":"sequence","title":"Recycling report","start":"This report shows that people are recycling more and more every year.","lines":["If we don’t continue communicating how important recycling is, numbers may drop.","Our objective is to prevent this by launching an outdoor campaign recruiting volunteers.","While nowadays, 45% do it on a regular basis. However, we need to do more.","This way, not only people, but also the volunteers will be engaged in a common effort.","Only 20% of the people recycled plastic and cans twenty years ago."],"answer":[4,2,0,1,3],"vi":["Báo cáo cho thấy số người tái chế tăng qua từng năm.","Nếu không tiếp tục truyền thông về tầm quan trọng của tái chế, con số có thể giảm.","Mục tiêu là ngăn điều này bằng chiến dịch ngoài trời tuyển tình nguyện viên.","Hiện nay 45% người dân tái chế thường xuyên, nhưng cần làm nhiều hơn.","Bằng cách này, người dân và tình nguyện viên sẽ cùng tham gia một nỗ lực chung.","Hai mươi năm trước chỉ 20% người dân tái chế nhựa và lon."],"glossary":[["on a regular basis","ɒn ə ˈreɡjələ ˈbeɪsɪs","Regularly.","một cách thường xuyên"]]},{"type":"matching","title":"Holiday destinations","texts":["I love traveling by myself and fortunately now it’s not so weird. Many people have started doing it for some time now. Every year, I take some trip or other so that I can be on my own, truly relax, get away from it all. Last year, I rented a cabin in Iceland. It was great! I learned how to fish in an ice lake, and could read as much as I liked. Of course, money can be a limitation. But if you are not too picky, you can always find something you will enjoy.","Having a family of 4, you need to consider alternatives which will make everybody happy. If you don’t think of your children, they will make your life hard all throughout. After trying different things, we found that camping was the best alternative. Children can move around easily in a safe environment, make friends, ride their bikes, while you and your partner can just relax and enjoy a beautiful garden of wonderful natural views.","I like to take three or four breaks a year, so I can’t make long trips. Long trips are wonderful, but I work very hard, my job is very stressful, so I need to take breaks frequently not to go mad. Usually I take a few days off here and there and get some all-inclusive holiday package where I can just forget about the world, and let the world take care of me. It can be anywhere, I love the beach, though. I usually go with somebody who is free at the time, either my boyfriend or a friend.","Have you ever taken cruise holidays? Let me tell you why you should. First of all, you can forget about cooking or washing the dishes, making your bed, cleaning, everything for a whole week. Then, you can get ready to be amused and entertained 24 hours a day. There’ll be people following your every step making sure you’ll have a nice time. You’ll meet new people too. My wife and I have made many good friends on a cruise."],"questions":["Who thinks money shouldn’t stop you from enjoying wonderful holidays?","Who doesn’t have much time to travel?","Who thinks you shouldn’t be selfish when choosing holidays?","Who has met new people while on holidays?","Who enjoys the actual journey and not the destination?","Who found a great holiday solution after many tries?","Who says people didn’t use to travel on their own in the past?"],"answer":[["A"],["C"],["B"],["D"],["D"],["B"],["A"]],"vi":["A thích du lịch một mình, từng thuê cabin tại Iceland và cho rằng vẫn có thể tìm kỳ nghỉ phù hợp dù ngân sách hạn chế.","B ưu tiên nhu cầu của cả gia đình và chọn cắm trại sau khi thử nhiều hình thức.","C có ít thời gian nên thường mua gói nghỉ dưỡng trọn gói ngắn ngày.","D thích du thuyền vì được phục vụ, giải trí và kết bạn mới."],"qvi":["Ai cho rằng tiền không nên ngăn bạn tận hưởng kỳ nghỉ?","Ai không có nhiều thời gian để đi xa?","Ai cho rằng không nên ích kỷ khi chọn kỳ nghỉ?","Ai đã gặp bạn mới trong kỳ nghỉ?","Ai thích hành trình hơn điểm đến?","Ai tìm được giải pháp nghỉ dưỡng tốt sau nhiều lần thử?","Ai nói trước đây mọi người ít đi du lịch một mình?"],"glossary":[["get away from it all","ɡet əˈweɪ frəm ɪt ɔːl","Escape everyday pressure.","tạm rời mọi áp lực"]],"notes":{},"notesvi":{}},{"type":"headings","title":"Food printing","texts":["Developments in the additive manufacturing industry combined with growing accessibility and cheaper costs in 3D printing have opened the doors to a rapidly growing new industry over the last decades. 3D printing products and services are expected to leap to over 40 billion US dollars by 2024. The reason for this significant development is that it saves time and money. 3D food printing will open the doors to more creative culinary practices, safer food methods, healthier food options, and more environmentally viable food production processes. A food experience focusing both on taste and aesthetics.","3D printing, also known as additive manufacturing, is the process of creating three dimensional solid objects from digital input. Different products are usually created pouring one layer over another. Individuals, small businesses, and big corporations can harness this technology to create cost-effective rapid creations, everything from prototypes to home-made food. Eventually, the aim is to have a 3D printer in every kitchen to create meals on demand. With a simple download of software including nutritional requirements, taste profile, allergy information, among others, this printer would go on to create or print not only industrial products, but also meals in a matter of minutes.","This may sound as a science fiction film, but it is certainly not. In fact, there are kitchens popping up all over the world equipped with the first models of this technology. Even more so, there are already a few printers on the market which allow to create tasty and original printed dishes, fashion tailored to people’s individual needs and specifications. The additive manufacturing food industry will give everyday consumer more choice and accessibility to the foods of their choice. Anyone missing some New York cheesecake when abroad may simply print it wherever they are now.","One example of the countless possibilities 3D printing will provide is the Edible Growth project, launched by the Future Food Designer, Chloé Rutzerveld. This creative project relies on the power of additive manufacturing to present us with “edible ecosystems”, more specifically, a completely edible mini garden. Her edible support structures are a breeding ground with various organisms directly printed inside a tiny reusable greenhouse according to a custom made 3D file. The unique design of the structure prevents the organisms cross infection. Not only are Rutzerveld’s food options beautiful organic looking structures, but they are also a sustainable and healthy alternative to some of the more traditional ways you eat.","3D printing has also caught ecologists eye to help in the disposal of food waste. Founded by Van Doleweerd along with Vita Broeken, the company Upprinting perseveres in their mission to transform unwanted and discarded food into paste filament which can be used to produce fancy snacks. This food paste can be stored for extended periods of time and can be used to create a host of dishes. Different recipes and ideas are offered on their website to help the public become aware and used to this increasingly popular trend.","Many restaurant owners and chefs have started designing their own silverware and plates for a new 3D printing experience at their tables. Plates can now be simply created on the day they will be used. Even more so, they might also be edible. The company byFlow kitchen offers customers their own 3D food printer; this device can not only help chefs to create a host of delicious dishes, but also create custom plates for your creations and serving areas. Edible 3D printed biodegradable dishes are both cool and delicious.","Across multiple industries, one of the greatest appeals of 3D printing is the fact that it is highly customizable to users’ needs or preferences allowing for hyper-customization. The same applies to the 3D printing food industry. In the near future, based on your own biological information, taste preferences, and health needs you will be able to print food that is just right for you. Take a look around the tech/restaurant world and you are beginning to see this come into fruition. 3D food printing will have a huge impact in our world, and in our kitchens eventually. It will dramatically restructure food production practices, helping us reduce food waste, decreasing food stocks, and helping to recycle food waste. This will all be possible thanks to the fact that food will be created on demand basis. Some start-ups and experts have even suggested that 3D printing could gradually be used to solve global food shortage issues. For now, this is obviously just a dream, however, it is not too far farfetched to believe that food 3D printers could eventually become as widely distributed as microwaves have been."],"options":["Printing reused food","How does the future look for 3D food printing","Not only food","Booming industry","No limits to sustainable creativity","The mechanics","Dreaming away in real life"],"answer":[3,5,6,4,0,2,1],"vi":["Ngành in 3D phát triển nhanh nhờ chi phí giảm và khả năng ứng dụng vào thực phẩm.","Giải thích cơ chế in 3D theo từng lớp và mục tiêu tạo bữa ăn theo yêu cầu.","Máy in thực phẩm đã xuất hiện trong đời thực và tạo món ăn theo nhu cầu cá nhân.","Dự án Edible Growth thể hiện khả năng sáng tạo bền vững của in thực phẩm.","Công nghệ biến thực phẩm bỏ đi thành nguyên liệu in và đồ ăn mới.","In 3D không chỉ tạo thức ăn mà còn tạo đĩa, dụng cụ ăn có thể phân hủy hoặc ăn được.","Tương lai in thực phẩm hướng tới cá nhân hóa, giảm lãng phí và thiếu hụt lương thực."],"glossary":[["on demand","ɒn dɪˈmɑːnd","When requested.","theo nhu cầu"],["food waste","fuːd weɪst","Food that is thrown away.","thực phẩm bị lãng phí"]],"ovi":["In lại thực phẩm tái sử dụng","Tương lai của in thực phẩm 3D","Không chỉ là thực phẩm","Ngành công nghiệp bùng nổ","Sức sáng tạo bền vững không giới hạn","Cơ chế hoạt động","Điều tưởng như mơ đã thành hiện thực"]}]},{"title":"Test 6","pages":"108–112","parts":[{"type":"gap","title":"A job offer","text":"Dear Eduard,\nHow are you? I’m writing to tell you about a job offer I received. I don’t really know if I want to take it. I {0} you could help.\nIt’s a project in Australia for 2 years. They are {1} a bridge and they would like me to {2} them contributing to the design. I know you lived there when you were younger {3} I thought you could give me some advice.\n\nHope to {4} from you soon,\nRichard","options":[["thought","wanted","needed"],["doing","building","making"],["work","meet","join"],["anyway","but","so"],["speak","listen","hear"]],"answer":[["thought"],["building"],["join"],["so"],["hear"]],"vi":"Eduard thân mến,\nTôi viết thư để kể về một lời mời làm việc vừa nhận được. Tôi chưa biết có nên nhận hay không nên nghĩ rằng bạn có thể giúp. Đây là dự án xây cầu ở Úc kéo dài hai năm và họ muốn tôi tham gia thiết kế. Vì bạn từng sống ở đó nên tôi mong bạn cho lời khuyên.","glossary":[["job offer","dʒɒb ˈɒfə","An offer of employment.","lời mời làm việc"]]},{"type":"sequence","title":"University application","start":"Please follow these instructions to apply for university in this country.","lines":["Go to our website and click on the degree of your choice.","You can find tips to writing a good piece in the resources area.","We will review your information and give you an answer within 30 days.","Complete your profile with statistical information, and write a personal statement.","Fill in the information form, and attach a photo to create your profile."],"answer":[0,4,3,1,2],"vi":["Hãy làm theo các bước sau để nộp đơn vào đại học tại quốc gia này.","Vào trang web và chọn ngành học.","Có thể tìm mẹo viết bài trong mục tài nguyên.","Nhà trường sẽ xem hồ sơ và trả lời trong vòng 30 ngày.","Hoàn thiện hồ sơ bằng số liệu thống kê và bài luận cá nhân.","Điền biểu mẫu thông tin và đính kèm ảnh để tạo hồ sơ."],"glossary":[["personal statement","ˈpɜːsənəl ˈsteɪtmənt","An application essay about yourself.","bài luận cá nhân"]]},{"type":"sequence","title":"A dinner disaster","start":"I invited some friends over for dinner yesterday night.","lines":["She came three hours earlier and said she would make sushi.","I went to buy some ingredients while she started with the rice.","Because she’s a really good cook, and we are still very good friends.","When I came back, I found two firemen in my kitchen, and no sushi.","I’m not a good cook, so I asked my ex-girlfriend for help."],"answer":[4,2,0,1,3],"vi":["Tối qua tôi mời vài người bạn đến ăn tối.","Cô ấy đến sớm ba giờ và nói sẽ làm sushi.","Tôi đi mua nguyên liệu trong khi cô ấy nấu cơm.","Vì cô ấy nấu ăn rất giỏi và chúng tôi vẫn là bạn tốt.","Khi về, tôi thấy hai lính cứu hỏa trong bếp và không có sushi.","Tôi nấu ăn không giỏi nên nhờ bạn gái cũ giúp."],"glossary":[["invite friends over","ɪnˈvaɪt frendz ˈəʊvə","Ask friends to visit your home.","mời bạn đến nhà"]]},{"type":"matching","title":"Social Media","texts":["I’m not convinced social media is a good thing. There’s people who are just addicted to it. They are so dependant on other people reactions to what they publish that they can’t think of anything else any more. They become insecure, slaves, I would say, to how many “likes” or comments they get. I think social media should be banned in general. We should go back to calling people on the phone, asking them how they are.","Social media is just amazing. I’ve got in touch with people I hadn’t seen in 30 years! Just by typing their name, and sending them a message, you can regain a part of your life which otherwise you would’ve lost forever. In the past, if you wanted to find somebody, you needed to hire a private detective or something, nowadays, you can just look them up on Facebook for free. So, what’s wrong about that?","What I don’t like about social media is the use big companies make of personal information. It’s said they sell your preferences and make a lot of money out of it. I haven’t actually been called to be offered any service. I mean, they’ve tried, but I just block their numbers, or get their emails to spam. But anyway, making money out of people’s personal preferences and information is just not right. If I were the government, I would fine these companies severely.","Thanks to social media, I’ve been able to support my family at a very difficult time. I had just lost my job and couldn’t find another one. Social media has given me the chance to make some little money at first, and get a job for myself later. I appreciate all the support people around the world have given me at such a difficult time. On top of that, even though it’s hard at times, because there’s a lot to learn, I truly enjoy the challenge and helping people."],"questions":["Who thinks the administration should regulate social media?","Who got a second professional chance thanks to social media?","Who thinks social media has made it easier to find people?","Who thinks social media is harmful?","Who was helped by people worldwide?","Who doesn’t appreciate having their private data collected?","Who thinks some people are overly concerned about reactions to social media?"],"answer":[["C"],["D"],["B"],["A"],["D"],["C"],["A"]],"vi":["A cho rằng mạng xã hội gây nghiện, khiến người dùng lệ thuộc vào lượt thích và nên bị kiểm soát.","B yêu mạng xã hội vì có thể tìm lại người quen cũ dễ dàng.","C phản đối việc doanh nghiệp thu thập và kiếm tiền từ dữ liệu cá nhân.","D nhờ mạng xã hội mà kiếm được thu nhập, tìm được việc mới và nhận hỗ trợ toàn cầu."],"qvi":["Ai cho rằng chính quyền nên quản lý mạng xã hội?","Ai có cơ hội nghề nghiệp thứ hai nhờ mạng xã hội?","Ai nói mạng xã hội giúp tìm người dễ hơn?","Ai cho rằng mạng xã hội có hại?","Ai được người trên khắp thế giới giúp đỡ?","Ai không thích dữ liệu riêng tư bị thu thập?","Ai cho rằng một số người quá quan tâm đến phản ứng trên mạng xã hội?"],"glossary":[["get in touch","ɡet ɪn tʌtʃ","Contact someone.","liên lạc"],["personal information","ˈpɜːsənəl ˌɪnfəˈmeɪʃən","Private identifying data.","thông tin cá nhân"]],"notes":{},"notesvi":{}},{"type":"headings","title":"Producing Disease-Free DNA for all of us","texts":["Cut-and-paste DNA editors, like CRISPR, can access previously inaccessible genes. Thanks to these editors, opening up these areas of the genetic code is becoming more efficient and moving towards futuristic genetic-based fight against disease. DNA doesn't usually sit inside cells as a freely accessible devise. It's heavily protected in a package called chromatin, which controls what genes are activated or silenced by a cell at any moment in time.","Unfortunately, this packaging stops scientists from eliminating disease-causing mutations. Some scientists describe this chromatin blocking as “the elephant in the room” in CRISPR discussions. CRISPR–Cas9 and prime editing work by cutting DNA at a specific point in the genome and relying on the cell’s own repair system to fix the damage and make the edits. But that repair system is unreliable and can insert or delete DNA letters randomly at the points where the genome was cut. This can lead to an uncontrollable mixture of edits that vary between cells. This self-repair process makes it difficult for researchers to use CRISPR–Cas9 to overwrite one piece of DNA with a sequence of their choosing.","The idea is that if CRISPR needs to bind in the middle of a gene but is unable to bind close enough to edit the mutation efficiently, a chromatin-opening protein could be sent to a position right outside that hard-to-bind region, to rearrange the chromatin, and make the DNA across that gene more accessible for CRISPR to edit the gene. This all sounds very easy, but of course it is not. Researchers are working now on improving this technique to increase CRISPR efficiency. The idea is to try to adapt the system to target different genes, simply by switching the DNA-binding regions.","The specificity of the changes this tool is capable of creating could also help to develop models of disease in the laboratory, or to study the function of specific genes. It’s early days, but the findings look promising. More and more people are becoming interested in applying this technology in their research. Different versions of genome-editing platforms are still going to be needed for different types of editing needs, so that they can be adapted to deleting different types of diseases out of our DNA chain.","So far, researchers have worked on different versions of genome-editing platforms which is very time consuming and expensive. So, some researchers have set out to create a precise gene-editing tool which could give researchers the flexibility and control to make multiple types of edits without having to create individual systems. In 2018, the team hit on prime editing: a combination of enzymes, including a modified Cas9 enzyme, that could change individual DNA letters, delete letters, or insert a series of letters into a genome, with minimal damage to DNA strands. However, they will now need to carefully evaluate how well the system works in a variety of cells and organisms.","But prime editing is sometimes thought to be more precise and versatile than other CRISPR versions created so far. Prime editors include modified versions of CRISPR–Cas9 which allow researchers to replace one DNA letter with another. There are other older tools such as zinc-finger nucleases, which are difficult to tailor to each desired edit. So, all in all, the future looks very promising as it shows an improvement at every step of the way.","A lot of research is ongoing and many results are still to come out for us to have a clear understanding of how and when this technology will actually be ready and at hand to eliminate disease from our DNA. However, this first study is beginning, rather than ending and the long-standing aspiration in the life sciences to be able to control DNA may come to a happy ending, where diseases will be stopped at their onset, even before they come to show symptoms. There’s hope and effort put into this, even though effective solutions are yet to come, they are certainly underway."],"options":["Exceptions to the rule","A combined approach to evaluate","A long way ahead","Comparing editing technology","What is a DNA editor","Increasingly popular technology","A big obstacle","Focused on finding a solution"],"answer":[4,6,7,5,1,3,2],"vi":["Giới thiệu công cụ chỉnh sửa DNA như CRISPR và vai trò của chromatin.","Chromatin và hệ thống tự sửa chữa không ổn định là trở ngại lớn.","Các nhà nghiên cứu tập trung tìm cách mở chromatin để tăng hiệu quả chỉnh sửa.","Công nghệ ngày càng được quan tâm và cần nhiều nền tảng cho các nhu cầu khác nhau.","Prime editing kết hợp nhiều enzyme để tạo nhiều loại chỉnh sửa chính xác.","So sánh prime editing với CRISPR và các công cụ cũ.","Vẫn còn nhiều nghiên cứu phải thực hiện trước khi kiểm soát DNA để ngăn bệnh."],"glossary":[["disease-causing mutation","dɪˈziːz ˌkɔːzɪŋ mjuːˈteɪʃən","A genetic change that causes illness.","đột biến gây bệnh"],["a long way ahead","ə lɒŋ weɪ əˈhed","Much work remains.","còn một chặng đường dài"]],"ovi":["Ngoại lệ của quy tắc","Cách tiếp cận kết hợp để đánh giá","Còn một chặng đường dài","So sánh công nghệ chỉnh sửa","Công cụ chỉnh sửa DNA là gì?","Công nghệ ngày càng phổ biến","Một trở ngại lớn","Tập trung tìm giải pháp"]}]},{"title":"Test 7","pages":"113–118","parts":[{"type":"gap","title":"A cottage holiday","text":"Dear granny,\nHow are you? I’m happy to tell you we are going to have a week holidays soon. We thought we could {0} some days with you in the country. Would you like that?\nThere’s a {1} for rent in Essex which looks just {2}. I’ll send you some photos soon {3} that you can see if you like it.\n\nI’m sure we will {4} a wonderful time. Please say you will come with us.\nLove,\nPete and Sue","options":[["spend","pass","go"],["apartment","cottage","tent"],["far","spooky","lovely"],["in","as","so"],["be","take","have"]],"answer":[["spend"],["cottage"],["lovely"],["so"],["have"]],"vi":"Bà thân mến,\nChúng cháu sắp có kỳ nghỉ một tuần và muốn ở cùng bà vài ngày ở vùng quê. Có một căn nhà nhỏ cho thuê tại Essex trông rất đẹp. Cháu sẽ gửi ảnh để bà xem. Chắc chắn chúng ta sẽ có khoảng thời gian tuyệt vời.","glossary":[["have a wonderful time","hæv ə ˈwʌndəfəl taɪm","Enjoy yourself very much.","có khoảng thời gian tuyệt vời"]]},{"type":"sequence","title":"A good first paragraph","start":"Every article needs a good first paragraph.","lines":["It has to be short and interesting to grab people’s attention from the beginning.","Having this general introduction, the reader will feel encouraged to read on.","The best way to start is to think of a good opening line.","All the ideas we want to develop later need to be introduced after that.","So that the reader gets a complete picture of what the article will be about."],"answer":[2,0,3,4,1],"vi":["Mọi bài báo đều cần một đoạn mở đầu tốt.","Đoạn mở đầu phải ngắn, thú vị để thu hút người đọc ngay từ đầu.","Nhờ phần giới thiệu chung, người đọc sẽ muốn đọc tiếp.","Cách tốt nhất là nghĩ ra một câu mở đầu hay.","Các ý sẽ phát triển sau đó cần được giới thiệu tiếp theo.","Nhờ vậy người đọc có bức tranh đầy đủ về nội dung bài."],"glossary":[["grab people’s attention","ɡræb ˈpiːpəlz əˈtenʃən","Make people notice.","thu hút sự chú ý"]]},{"type":"sequence","title":"Furniture over the years","start":"This report shows the changes in the way we buy furniture over the years.","lines":["People have less time and more resources now, so these stores prove useful.","The future may be one where people will be able to design their own furniture.","An example of these is the flat-pack design offered by stores like IKEA.","In the past, furniture was made to last for generations and styles didn’t change much.","Nowadays, we have more styles than we can count, and new trends appear all the time."],"answer":[3,4,2,0,1],"vi":["Báo cáo cho thấy cách mua đồ nội thất thay đổi qua các năm.","Ngày nay người ta có ít thời gian nhưng nhiều nguồn lực hơn nên các cửa hàng này hữu ích.","Tương lai người dùng có thể tự thiết kế đồ nội thất.","Một ví dụ là thiết kế đóng gói phẳng của IKEA.","Trước đây đồ nội thất được làm để dùng nhiều thế hệ và kiểu dáng ít thay đổi.","Ngày nay có vô số phong cách và xu hướng mới xuất hiện liên tục."],"glossary":[["flat-pack design","ˈflæt pæk dɪˈzaɪn","Furniture sold in pieces for assembly.","thiết kế nội thất đóng gói phẳng"]]},{"type":"matching","title":"Mass tourism","texts":["Some cities aren’t residential areas any more, they look like some huge theme park for adults. Everywhere you look, you see tourists having a good time for a couple of days. It would be all right, if it wasn’t for the fact that ecologically speaking the damage is unbelievable. The amount of waste, and air pollution because of increasing numbers of flights and cruises compels us to rethink the whole structure, I should think.","We’ve come a long way since the middle ages, when holidays and travelling was just reserved for the nobility. More and more people can take time off, and get well deserved holidays. There’s mass everything now, anyway: mass consumption, mass media, mass produce, mass culture. So, why shouldn’t we have some mass tourism as well. All it means is that now there’s more and more people who are able to see the world and enjoy some free time.","Many economies are very much dependent on tourism. Many people have come out of very vulnerable situations thanks to tourism. I believe tourism is a great wealth redistribution system, where richer people part with their money in favor of not so fortunate ones. I think it’s very positive. Not only do people get a better grasp of the differences in culture around the world, but more people get the chance to gain a decent income.","What I love about mass tourism is the chance many families have of getting some needed extra money. There are many platforms offering families the chance to share their home with potential tourists who may not have the resources to afford hotel accommodation. I think mass tourism is more democratic. The way I see it, it should be called democratic tourism."],"questions":["Who thinks renting a room to tourists can help make ends meet?","Who thinks tourism damages the environment?","Who thinks “mass” is a common term now?","Who thinks mass tourism is a weapon against financial inequality?","Who thinks mass tourism allows more people to travel?","Who would change the way we call mass tourism?","Who thinks mass tourism helps understand diversity?"],"answer":[["D"],["A"],["B"],["C"],["B"],["D"],["C"]],"vi":["A cho rằng du lịch đại chúng gây rác thải và ô nhiễm nghiêm trọng.","B cho rằng du lịch không còn dành riêng cho giới quý tộc và nhiều người được đi hơn.","C xem du lịch là cách tái phân phối của cải và giúp hiểu sự đa dạng văn hóa.","D cho rằng cho thuê nhà giúp gia đình tăng thu nhập và muốn gọi đây là du lịch dân chủ."],"qvi":["Ai cho rằng cho khách thuê phòng giúp trang trải cuộc sống?","Ai cho rằng du lịch gây hại môi trường?","Ai nói “đại chúng” là một thuật ngữ phổ biến?","Ai xem du lịch đại chúng là công cụ chống bất bình đẳng tài chính?","Ai nói du lịch đại chúng giúp nhiều người được đi hơn?","Ai muốn đổi tên du lịch đại chúng?","Ai nói du lịch giúp hiểu sự đa dạng?"],"glossary":[["make ends meet","meɪk endz miːt","Have enough money for basic needs.","đủ tiền trang trải"],["wealth redistribution","welθ ˌriːdɪstrɪˈbjuːʃən","Moving wealth across groups.","tái phân phối của cải"]],"notes":{},"notesvi":{}},{"type":"headings","title":"Silicon Valley going carbon free","texts":["Even though we can’t see it, cloud technology carbon footprint is quite significant. When users stream videos, or send messages, they access their data which is stored in the cloud via electricity. It is estimated that data centres are responsible for 0.3 percent of all global carbon emissions, and are expected to increase as global use of cloud services increase. Multiple companies have made big structural decisions and investments to reduce their carbon emissions and go greener. Counting data center processing, mineral conflicts, huge profits and increasing influence, the tech industry is by all means quite impactful.","A recent report on Tech Industry carbon emissions has used three parameters to evaluate each company data service, which are source of electricity, infrastructure efficiency, and server efficiency. Though reasonable enough, these parameters suggest there is one aspect which is frequently missed when assessing a company true carbon-emissions, which is renewable energy credits (RECs). RECs are intangible energy commodities that confirm one megawatt-hour (MWh) of electricity is generated and delivered to the grid from a renewable energy resource. A kind of certificate, RECs essentially track renewable energy generation.","Electricity is fed into power grids from both sustainable and non-sustainable sources, a mix of renewable and fossil-fuel energy. RECs were designed to record and claim the renewable energy a customer generates. Generally speaking, buying a REC is like buying the environmental benefits of renewable energy and support green energy. However, it does not necessarily mean a company is actually using that clean energy. As companies may be producing carbon footprint, but buying RECs from a clean company to compensate for it.","For example, Google still needs some energy from data centres powered by fossil fuels, but has compensated the impact by purchasing RECs. It is reported to have the highest renewable energy investment portfolio, and keeps its data centres cool, and energy efficient by using machine learning to synchronise average weather patterns. Microsoft has been operating carbon neutral for about seven years, if RECs are included. Without RECs, the number is reported to go down to 60 percent. Microsoft is committed to go fully green, and pays self-imposed carbon taxes, and invests in sustainable energy projects, including hydropower purchases, wind farm partnerships, and keeping data centres on the seafloor.","Lastly, the largest cloud computing provider, Amazon, ultimately grades the worst. Despite goals of net zero carbon emissions in 2040 and the construction of wind and solar farms, the statement that Amazon achieved 50 percent renewable energy - RECs included - was debunked in a Greenpeace report. Instead, the report states that Jeff Bezos’s company runs its data centers largely on fossil fuels headquartered in Northern Virginia. Amazon is pledging to reduce its fossil fuel consumption, mainly due to employee pressure. Moreover, the company’s reticence to reveal its energy data doesn’t inspire trust in its customers.","Organisations such as GreenPeace have long been checking up on different companies across industries with the aim to persuade them to analyse their activities from an environmental standpoint. In the case of big Tech Companies, they’ve been supported by these companies employees, who have also been adamant in their stand towards making a contribution to the global fight against climate change. Possibly these two forces combined have shown the results being reported. That is to say, more and more pledges from these companies towards becoming completely carbon free by the year 2030-40.","Big tech companies are gradually moving towards greener and greener practices. So, although the effects on the global climate remain, cutting down carbon emissions is of utmost importance for all our sakes. These changes are never as fast as one should wish, however, being on the right path and correcting diversions when they happen, the industry is confident, as are their users, that the benefits of these services will not supersede the global consequences."],"options":["A big one lagging close behind","Bottom line","Company unions and external pressure","Becoming aware of the damage","Nobody cares anymore","What big techs are actually doing","Measuring the damage","Trading footprint"],"answer":[3,6,7,5,0,2,1],"vi":["Dữ liệu đám mây tạo dấu chân carbon đáng kể mà người dùng khó nhìn thấy.","Báo cáo đo phát thải bằng nhiều tiêu chí, trong đó có chứng chỉ năng lượng tái tạo.","Giải thích việc mua REC để bù đắp dấu chân carbon.","Các biện pháp Google và Microsoft đang thực hiện để giảm phát thải.","Amazon xếp sau dù đã công bố mục tiêu năng lượng tái tạo.","Tổ chức môi trường và nhân viên cùng gây áp lực buộc doanh nghiệp thay đổi.","Ngành công nghệ đang đi đúng hướng nhưng vẫn phải tiếp tục giảm phát thải."],"glossary":[["carbon footprint","ˈkɑːbən ˈfʊtprɪnt","Total greenhouse-gas impact.","dấu chân carbon"],["renewable energy","rɪˈnjuːəbəl ˈenədʒi","Energy from sources that renew naturally.","năng lượng tái tạo"]],"ovi":["Một ông lớn đang tụt lại phía sau","Kết luận cốt lõi","Liên minh trong công ty và áp lực bên ngoài","Nhận thức về thiệt hại","Không ai còn quan tâm","Các ông lớn công nghệ thực sự đang làm gì","Đo lường thiệt hại","Mua bán dấu chân carbon"]}]},{"title":"Test 8","pages":"119–123","parts":[{"type":"gap","title":"A new friend","text":"Dear Mum and Dad,\nI’m so happy you’re both well. Here I am with Robert by my side. He’s just come back from school. He’s very happy because he has made a new friend. They get {0} very well. They {1} like football and cycling.\nHe’s doing very well at school too. His favourite subject is science and {2} he wants to become a vet. But you know children, he changes his {3} all the time. Last year, he wanted to be a policeman.\nWe’ll be going to Killarney in the summer, I thought you’d like to join us {4}.\n\nLove,\nJess","options":[["on","together","friends"],["always","both","practice"],["tells","speaks","says"],["objectives","opinion","mind"],["once","always","maybe"]],"answer":[["on"],["both"],["says"],["mind"],["maybe"]],"vi":"Bố mẹ thân mến,\nRobert đang ở bên con. Em vừa đi học về và rất vui vì có bạn mới. Hai bạn rất hợp nhau và đều thích bóng đá, đạp xe. Em học tốt, thích khoa học và có lẽ muốn làm bác sĩ thú y, nhưng trẻ con thường đổi ý. Mùa hè này chúng con sẽ đến Killarney và hy vọng bố mẹ tham gia.","glossary":[["get on well","ɡet ɒn wel","Have a good relationship.","hòa hợp"]]},{"type":"sequence","title":"Take a good photograph","start":"Taking a good photograph is not easy. But there are many tips we can follow.","lines":["The light is essential, but also is the focus.","Photographers say we need to try again and again until we get what we want.","Finding an object which is both interesting and attractive is imperative.","If the object is out of focus, the whole photo may be compromised.","Then, we need to get the right frame for it. Many things can affect our frame."],"answer":[2,4,0,3,1],"vi":["Chụp một bức ảnh đẹp không dễ, nhưng có nhiều mẹo có thể áp dụng.","Ánh sáng rất quan trọng, tiêu điểm cũng vậy.","Nhiếp ảnh gia nói phải thử nhiều lần đến khi đạt điều mình muốn.","Tìm một chủ thể vừa thú vị vừa hấp dẫn là điều bắt buộc.","Nếu chủ thể mất nét, toàn bộ bức ảnh có thể bị hỏng.","Sau đó cần chọn khung hình phù hợp vì nhiều yếu tố ảnh hưởng đến khung hình."],"glossary":[["out of focus","aʊt əv ˈfəʊkəs","Not sharp in a photograph.","mất nét"]]},{"type":"sequence","title":"Learning to drive","start":"My father taught me how to drive when I was 16.","lines":["Apart from that, the brake was very hard to push.","He made it look as if it was easy but I can tell you it wasn’t so easy for me.","It took me over a year to really feel confident and in control of the vehicle.","There were certainly too many things to pay attention to, and you can get confused.","The accelerator was too far from my feet, so I had to stretch out."],"answer":[1,3,4,0,2],"vi":["Bố dạy tôi lái xe khi tôi 16 tuổi.","Ngoài ra, bàn đạp phanh rất khó nhấn.","Bố làm mọi thứ trông dễ nhưng với tôi thì không.","Tôi mất hơn một năm mới thật sự tự tin và kiểm soát được xe.","Có quá nhiều thứ phải chú ý nên rất dễ bối rối.","Bàn đạp ga quá xa chân nên tôi phải duỗi người."],"glossary":[["pay attention to","peɪ əˈtenʃən tə","Focus on something.","chú ý đến"]]},{"type":"matching","title":"Fashion wear","texts":["I can’t understand some people’s obsession with fashion. To me, clothes are just things you need to wear so that you don’t end up in jail. I do follow some basic rules, though. I don’t wear just anything to go anywhere. I wear urban casual to work, and fancy clothes to a party, of course. But I know of people who keep track of the latest fashion designs, and rush to the stores to be the first to get them. I think this is just unhealthy.","Clothes are very important to me. They help me feel like myself, and easily communicate who I am to the world. I think you can identify what kind of person somebody is by looking at their clothes. And that is what I like, being able to communicate without words and to send a message about who I am through my own personal image. Without clothes, it would be much harder. I think they are fundamental to our self expression.","I love urban tribe clothes. I join one or the other from time to time. I love meeting very different people, and knowing that if I wear the right clothes, I’ll be accepted and be part of a group. Clothes help you stand out in a crowd, and meet people who share your same interests and values. I think urban tribes are a way to connect, which is not internet oriented, but face to face.","I haven’t really thought about fashion before. But I guess it’s fair to say it’s a wonderful industry, providing jobs everywhere on Earth. Working conditions are said not to be the best in some countries, but I think that can easily be changed if companies commit to it. I know very many people who have a job connected to that area of business. So, all in all, it can’t be so bad. We’ve been interested in our looks even before Cleopatra."],"questions":["Who makes use of clothes to express themselves?","Who uses clothes to socialise with different collectives?","Who says they get dressed just to avoid prison?","Who has a global economy point of view on fashion?","Who talks about fashion throughout history?","Who wants to feel accepted?","Who can tell how people are by looking at their outfits?"],"answer":[["B"],["C"],["A"],["D"],["D"],["C"],["B"]],"vi":["A chỉ xem quần áo là nhu cầu cơ bản và không thích chạy theo mốt.","B dùng trang phục để thể hiện bản thân và nhận biết tính cách người khác.","C mặc theo các nhóm văn hóa đô thị để được chấp nhận và kết nối trực tiếp.","D nhìn thời trang dưới góc độ ngành kinh tế toàn cầu và lịch sử lâu đời."],"qvi":["Ai dùng quần áo để thể hiện bản thân?","Ai dùng quần áo để giao lưu với các nhóm khác nhau?","Ai nói họ mặc đồ chỉ để khỏi vào tù?","Ai nhìn thời trang từ góc độ kinh tế toàn cầu?","Ai nói về thời trang trong suốt lịch sử?","Ai muốn cảm thấy được chấp nhận?","Ai đoán tính cách người khác qua trang phục?"],"glossary":[["stand out in a crowd","stænd aʊt ɪn ə kraʊd","Be easy to notice.","nổi bật giữa đám đông"],["self-expression","ˌself ɪkˈspreʃən","Showing your personality or feelings.","sự thể hiện bản thân"]],"notes":{},"notesvi":{}},{"type":"headings","title":"Will we have a map of our brain in our smartphone?","texts":["What if we had an app like Google Maps showing us the way around our brain? Scientists have set out to develop a complete map of the human brain. The idea is to chart where every neuron crosses paths with all others. The main obstacle to such enterprise is that the brain has more connections stars on the sky. A map of the brain would consist of the single largest database ever created in the history of the world. Making such a map could need not just one lifetime, but dozens. Yet, it turns out it might just be possible to achieve it in the next few years.","A new supercomputer is being built, scheduled to be ready by 2021, which will run one quintillion operations in parallel, making it an equal to the processing power of the human brain. Countries such as the US and China are competing to achieve what would be both a national status symbol and a scientific game-changer. The finished US supercomputer, Aurora 21, is estimated at hundreds of millions of dollars. It will be around a quarter-acre big, and need as much electricity as a medium-sized city.","Aurora 21 is being designed to be able to do much more than just emulating our brains. It will be expected to perform computationally demanding simulations such as predicting the weather, tracing cosmic evolution, and studying new medicines pharmacology. Every step further in computing breakthroughs opens new opportunities for research. This one, though, is particularly significant for neuroscience. Scientists hope to use this brain simulator to gain further insight into the largely unknown processes behind human learning, behaviour, and even psychiatric disorders.","Compared to animals, the human being is born utterly useless. A mosquito is born already able to function as such and provide of itself, while the human brain is born in a completely helpless state depending on others to achieve complete functionality many years after being born. To compensate for this lack of instant capacity, we are able to learn almost anything and fill the relatively empty vessel with any kind of information we may choose. We are born on an empty page and 100 billion neurons which perform different combinations over time to create the hardware with which we operate.","So far, nobody knows exactly how the brain operates. It is to discover this the supercomputer will be most helpful. Aurora 21 is expected to be able to piece together millions of two-dimensional images, to represent the brain in three dimensions, creating a brain map, known as a connectome. Not very different to a city map, the connectome will give information as to which parts of the brain hold the most traffic, and which parts are directly connected to others. Multiple brains will be mapped to draw conclusions through comparison, analyse differences across ages, among many others, even compared to animals, to be able to see different structural principles of problem-solving evolution.","The structural map is just one part of the story, though, just a starting point. Merged with the brain electrical activity, it will be possible to analyse a person’s learning and behaviour. Many disorders, such as autism and schizophrenia, are thought to be likely rooted in anomalies in the structure of neurones. Disease diagnose today is based on observations through a microscope to identify altered cells. But MRIs and other current brain-imaging methods can’t draw a connection between cause and effect. A finely tuned map of the brain could provide that information and help in the diagnosis of psychiatric disorders, possibly even predicting them.","Almost unnoticed, neuroscience has silently evolved into a big-data project. Aurora 21 will make its contribution to harness such a transformation. Having seen a similar change in physics, for example, where massive, expensive equipment has brought scientists to work together more by having to share the machines in turns to gain access to unlimited potential for their research. In the process, those collective efforts push the field forward in a way that a lonely mechanism or thousands of independent scientists never could. It is man’s desire that this is the beginning of many more group oriented and highly ambitious neuroscience."],"options":["A map to intelligence evolution","A collaborative work ongoing","Analysing mapping alternatives","Powerful combination","Huge megadata","Born useless, destined to success","Race already started","Extraordinary future uses"],"answer":[4,6,7,5,0,3,1],"vi":["Việc lập bản đồ não đòi hỏi xử lý một lượng dữ liệu khổng lồ.","Cuộc đua xây siêu máy tính có sức mạnh tương đương não người đã bắt đầu.","Siêu máy tính có thể được dùng cho thời tiết, vũ trụ, y học và thần kinh học.","Con người sinh ra phụ thuộc nhưng có khả năng học tập đặc biệt.","Connectome là bản đồ ba chiều giúp so sánh cấu trúc và sự tiến hóa của não.","Kết hợp cấu trúc với hoạt động điện có thể giúp chẩn đoán rối loạn tâm thần.","Nghiên cứu não ngày càng phụ thuộc vào hợp tác và dữ liệu lớn."],"glossary":[["piece together","piːs təˈɡeðə","Combine parts to form a whole.","ghép nối"],["processing power","ˈprəʊsesɪŋ ˈpaʊə","A computer’s ability to process data.","năng lực xử lý"]],"ovi":["Bản đồ tiến hóa trí tuệ","Công việc hợp tác đang tiếp diễn","Phân tích các phương án lập bản đồ","Sự kết hợp mạnh mẽ","Dữ liệu siêu khổng lồ","Sinh ra bất lực nhưng được định sẵn để thành công","Cuộc đua đã bắt đầu","Những ứng dụng tương lai phi thường"]}]}];
const KEY='pop-dossier-reading-tests-5-8-v1',LETTERS=['A','B','C','D'];
const el=id=>document.getElementById(id);let state={test:0,part:0,vi:false,work:{}};try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.work&&typeof x.work==='object'&&!Array.isArray(x.work)){state.work=x.work;state.test=Number.isInteger(x.test)&&x.test>=0&&x.test<4?x.test:0;state.part=Number.isInteger(x.part)&&x.part>=0&&x.part<5?x.part:0;state.vi=!!x.vi}}catch{}
let active=0,speaking=null;const part=()=>DATA[state.test].parts[state.part],workKey=()=>state.test+'-'+state.part;
function work(){let w=state.work[workKey()];if(!w||!Array.isArray(w.a)){w={a:[],checked:false};state.work[workKey()]=w}return w}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));el('saved').textContent='Saved on this device'}catch{el('saved').textContent='Use Download answers to save'}}
function make(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function btn(text,fn,cls=''){const n=make('button',cls,text);n.type='button';n.onclick=fn;return n}
function translated(text){const n=make('div','vi',text);n.lang='vi';return n}
function stopAudio(){if('speechSynthesis'in window)speechSynthesis.cancel();if(speaking){speaking.textContent=speaking.dataset.label;speaking=null}}
function play(text,b){if(!('speechSynthesis'in window)){el('audioStatus').textContent='Audio is unavailable in this browser.';return}const same=speaking===b;stopAudio();if(same)return;const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.88;const vv=speechSynthesis.getVoices(),voice=vv.find(v=>v.lang==='en-GB')||vv.find(v=>v.lang.startsWith('en'));if(voice)u.voice=voice;speaking=b;b.textContent='■ Stop';el('audioStatus').textContent='';u.onend=()=>{if(speaking===b){b.textContent=b.dataset.label;speaking=null}};u.onerror=e=>{if(speaking===b){speaking=null;b.textContent=b.dataset.label;if(!['canceled','interrupted'].includes(e.error))el('audioStatus').textContent='Audio could not play. Try again with an English voice on your device.'}};speechSynthesis.speak(u)}
function audio(text,label='▶ Listen'){const b=btn(label,()=>play(text,b),'speak');b.dataset.label=label;b.setAttribute('aria-label',label==='▶'?'Listen to '+text:label);return b}
function rich(text){const n=make('div','text');let pos=0,low=text.toLowerCase();while(pos<text.length){let next=-1,phrase='';part().glossary.forEach(([p])=>{const at=low.indexOf(p.toLowerCase(),pos);if(at>=0&&(next<0||at<next)){next=at;phrase=p}});if(next<0){n.append(document.createTextNode(text.slice(pos)));break}n.append(document.createTextNode(text.slice(pos,next)));n.append(make('mark','',text.slice(next,next+phrase.length)));pos=next+phrase.length}return n}
function accepted(p,i,value){return p.type==='sequence'?value===p.answer[i]:p.type==='headings'?value===p.answer[i]:p.answer[i].includes(value)}
function total(p){return p.answer.length}
function answered(p,w){return p.type==='sequence'?w.a.length:w.a.filter(x=>x!==null&&x!==undefined&&x!=='').length}
function score(p,w){return p.answer.reduce((n,_,i)=>n+(accepted(p,i,w.a[i])?1:0),0)}
function status(){let n=0;for(let j=0;j<5;j++){const w=state.work[state.test+'-'+j];if(w&&Array.isArray(w.a))n+=answered(DATA[state.test].parts[j],w)}el('progress').textContent=n+' / 29 answered';const p=part(),w=work();el('message').textContent=w.checked?score(p,w)+' / '+total(p)+' correct':answered(p,w)+' / '+total(p)+' answered';}
function choose(i,val){work().a[i]=val;save();renderContent()}
function note(p,i){const f=make('div');if(p.notes&&p.notes[i]){f.append(make('div','',p.notes[i]));if(p.notesvi?.[i])f.append(translated(p.notesvi[i]))}return f}
function feedback(i){const p=part(),w=work(),f=make('div','feedback');if(!w.checked)return f;const ok=accepted(p,i,w.a[i]);let a=p.answer[i];if(p.type==='headings')a=p.options[a];else if(Array.isArray(a))a=a.join(' / ');f.append(make('strong','',ok?'✓ Correct':'✗ Answer: '+a));f.append(note(p,i));return f}
function navNumbers(count){const nav=make('div','mini-nav');for(let i=0;i<count;i++){const b=btn(String(i+1),()=>{active=i;stopAudio();renderContent()});b.setAttribute('aria-pressed',active===i);if(work().checked)b.classList.add(accepted(part(),i,work().a[i])?'good':'bad');nav.append(b)}return nav}
function choiceList(values,i,vi){const list=make('div','options');values.forEach((v,j)=>{const value=part().type==='headings'?j:v,b=btn(v,()=>choose(i,value),'option');b.setAttribute('aria-pressed',work().a[i]===value);if(vi)b.append(translated(vi[j]));if(work().checked){if(accepted(part(),i,value))b.classList.add('good');else if(work().a[i]===value)b.classList.add('bad')}list.append(b)});return list}
function gapView(container){const p=part(),w=work(),left=make('section','panel'),right=make('section','panel');left.append(make('span','label','EMAIL'));const mail=make('div','text');p.text.split(/(\{\d+\})/).forEach(s=>{if(/^\{\d+\}$/.test(s)){const i=+s.slice(1,-1),b=btn(w.a[i]||'['+(i+1)+']',()=>{active=i;renderContent()},'gap');b.setAttribute('aria-label','Gap '+(i+1)+': '+(w.a[i]||'choose a word'));b.setAttribute('aria-pressed',active===i);if(w.checked)b.classList.add(accepted(p,i,w.a[i])?'good':'bad');mail.append(b)}else mail.append(document.createTextNode(s))});left.append(mail,translated(p.vi));right.append(make('span','label','CHOOSE A WORD'),navNumbers(5),choiceList(p.options[active],active),feedback(active));container.append(left,right)}
function sequenceView(container){const p=part(),w=work(),left=make('section','panel'),right=make('section','panel');left.append(make('span','label','YOUR ORDER'));const fixed=make('div','fixed',p.start);fixed.append(translated(p.vi[0]));left.append(fixed);if(!w.a.length)left.append(make('p','empty','Tap a sentence to place it here.'));w.a.forEach((idx,pos)=>{const b=btn('',()=>{w.a.splice(pos,1);save();renderContent()},'sentence');b.append(make('b','',String(pos+1)),document.createTextNode(p.lines[idx]),translated(p.vi[idx+1]));b.setAttribute('aria-label','Remove sentence '+(pos+1)+': '+p.lines[idx]);if(w.checked)b.classList.add(accepted(p,pos,idx)?'good':'bad');left.append(b)});right.append(make('span','label','SENTENCE BANK'));p.lines.forEach((line,i)=>{if(w.a.includes(i))return;const b=btn(line,()=>{w.a.push(i);save();renderContent()},'sentence');b.append(translated(p.vi[i+1]));right.append(b)});if(w.a.length===5)right.append(make('p','empty','All sentences placed. Tap a placed sentence to move it back.'));if(w.checked){const review=make('details','review'),sum=make('summary','','Correct order'),ol=make('ol');p.answer.forEach(idx=>{const li=make('li','',p.lines[idx]);li.append(translated(p.vi[idx+1]));ol.append(li)});review.append(sum,ol);right.append(review)}container.append(left,right)}
function matchingView(container){const p=part(),left=make('section','panel'),right=make('section','panel');p.texts.forEach((t,i)=>{const a=make('article','person');a.id='person-'+i;const h=make('h2');h.append(make('b','',LETTERS[i]),document.createTextNode('PERSON '+LETTERS[i]));a.append(h,audio(t),rich(t),translated(p.vi[i]));left.append(a)});p.questions.forEach((q,i)=>{const c=make('section','qcard'),h=make('h3','',(i+1)+'. '+q);c.append(h,translated(p.qvi[i]));const choices=make('div','choices');choices.setAttribute('role','group');choices.setAttribute('aria-label',q);LETTERS.forEach(v=>{const b=btn(v,()=>choose(i,v));b.setAttribute('aria-pressed',work().a[i]===v);if(work().checked){if(accepted(p,i,v))b.classList.add('good');else if(work().a[i]===v)b.classList.add('bad')}choices.append(b)});c.append(choices,feedback(i));if(work().checked){c.append(btn('Find person '+p.answer[i][0],()=>el('person-'+LETTERS.indexOf(p.answer[i][0])).scrollIntoView({block:'start',behavior:'smooth'}),'speak'))}right.append(c)});container.append(left,right)}
function headingView(container){const p=part(),left=make('section','panel'),right=make('section','panel');container.classList.add('headings-layout');left.append(make('span','label','PARAGRAPH '+(active+1)+' / 7'),navNumbers(7),audio(p.texts[active]),rich(p.texts[active]),translated(p.vi[active]));const nav=make('div','pagenav'),prev=btn('← Previous',()=>{active--;stopAudio();renderContent()}),next=btn('Next →',()=>{active++;stopAudio();renderContent()});prev.disabled=active===0;next.disabled=active===6;nav.append(prev,next);left.append(nav);right.append(make('span','label','CHOOSE A HEADING'),choiceList(p.options,active,p.ovi),feedback(active));container.append(left,right)}
function glossary(){const rows=el('glossaryRows');rows.replaceChildren();el('glossaryTitle').textContent='Collocations & useful phrases · '+part().glossary.length;part().glossary.forEach(([phrase,ipa,en,vi])=>{const c=make('div','chunk'),text=make('div');text.append(make('strong','',phrase),make('span','ipa','/'+ipa+'/'),make('p','',en),translated(vi));c.append(text,audio(phrase,'▶'));rows.append(c)})}
function renderContent(){stopAudio();const box=el('content');box.replaceChildren();box.className='layout';({gap:gapView,sequence:sequenceView,matching:matchingView,headings:headingView}[part().type])(box);status()}
function render(){stopAudio();document.body.classList.toggle('bilingual',state.vi);el('vi').setAttribute('aria-pressed',state.vi);el('vi').textContent=state.vi?'Tiếng Việt: on':'Tiếng Việt: off';el('tests').replaceChildren();DATA.forEach((t,i)=>{const b=btn(t.title,()=>{state.test=i;active=0;save();render()});b.setAttribute('aria-pressed',state.test===i);el('tests').append(b)});el('sections').replaceChildren();['1 · Gap fill','2 · Sequence','3 · Sequence','4 · Matching','5 · Headings'].forEach((s,i)=>{const b=btn(s,()=>{state.part=i;active=0;save();render()});b.setAttribute('aria-pressed',state.part===i);el('sections').append(b)});el('title').textContent=part().title;el('tag').textContent=DATA[state.test].title.toUpperCase()+' / TASK '+(state.part+1);el('instruction').textContent={gap:'Choose one word for each gap.',sequence:'Tap sentences in order. Tap a placed sentence to remove it.',matching:'Choose A–D for each question. A person may be used more than once.',headings:'Choose a heading for each paragraph.'+(part().options.length>7?' One heading is unused.':'')}[part().type];el('source').textContent='APTIS Reading 2020 · '+DATA[state.test].title+' · pp. '+DATA[state.test].pages;renderContent();glossary()}
el('vi').onclick=()=>{state.vi=!state.vi;save();document.body.classList.toggle('bilingual',state.vi);el('vi').setAttribute('aria-pressed',state.vi);el('vi').textContent=state.vi?'Tiếng Việt: on':'Tiếng Việt: off'};
el('check').onclick=()=>{if(answered(part(),work())<total(part())){el('message').textContent='Complete all '+total(part())+' answers before checking.';return}work().checked=true;save();renderContent()};
el('reset').onclick=()=>el('confirm').showModal();el('cancel').onclick=()=>el('confirm').close();el('erase').onclick=()=>{state.work[workKey()]={a:[],checked:false};active=0;save();render();el('confirm').close()};
el('download').onclick=()=>{const lines=[];DATA.forEach((t,ti)=>{lines.push(t.title);t.parts.forEach((p,pi)=>{const w=state.work[ti+'-'+pi]||{a:[]};lines.push('\n'+(pi+1)+'. '+p.title);for(let i=0;i<total(p);i++){let v=w.a[i];if(v===null||v===undefined)v='[No answer]';else if(p.type==='headings')v=p.options[v];else if(p.type==='sequence')v=p.lines[v];lines.push((i+1)+'. '+v)}if(w.checked)lines.push('Score: '+score(p,w)+' / '+total(p))});lines.push('\n')});const url=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'})),a=make('a');a.href=url;a.download='aptis-reading-tests5-8-answers.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
addEventListener('pagehide',stopAudio);render();
</script></body></html>
